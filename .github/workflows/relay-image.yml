name: Relay image

# Builds the relay image on every PR; publishes it to GHCR from main and v* tags (decision 0081).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/msuite-relay

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Relay distribution
        run: ./gradlew :server:installDist

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: msuite-relay:test

      - name: Smoke test
        run: |
          docker run -d --name relay -e PORT=10000 -p 10000:10000 msuite-relay:test
          # Docker's port proxy resets connections until the JVM listens, hence --retry-all-errors.
          curl --fail --silent --retry 30 --retry-all-errors --retry-delay 1 http://localhost:10000/health \
            || { docker logs relay; exit 1; }
          docker exec relay touch /data/probe
          docker rm -f relay

      - name: Compose smoke test
        working-directory: deploy/compose
        env:
          MSUITE_RELAY_IMAGE: msuite-relay:test
          RELAY_DOMAIN: localhost
          MSUITE_RELAY_ALLOW_GROUPS: SMOKE
        run: |
          docker compose up -d
          curl --fail --silent --insecure --retry 30 --retry-all-errors --retry-delay 1 https://localhost/health \
            || { docker compose logs; exit 1; }
          docker compose down -v

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name != 'pull_request'
        name: Publish
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
